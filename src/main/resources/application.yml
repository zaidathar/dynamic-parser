spring:
  application:
    name: dynamic-parser

app:
  config:
    github:
      enabled: true
      repo-owner: zaidathar
      repo-name: config-manager
      file-path: dynamic-parser-config.yml
      branch: main
      access-token: ${GITHUB_CONFIG_PAT}
    webhook:
      secret: ${GITHUB_WEBHOOK_TOKEN}
  security:
    webhook:
      rate-limit:
        minute: 1.0
        hour: 5.0
        day: 20.0

logging:
  level:
    org:
      springframework:
        web: INFO